<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 850" width="1550" height="850" role="img" aria-labelledby="title desc">
  <title id="title">The shopfloor-skills hand-off loop</title>
  <desc id="desc">Skills that see a problem hand it to skills that fix the cause, which hand the result to the skills that hold the gain in the control plan and station instructions. All 20 skills are available.</desc>
