<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="title desc">
  <title id="title">The shopfloor-skills hand-off loop</title>
  <desc id="desc">Skills that see a problem hand it to skills that fix the cause, which hand the result to the skills that hold the gain in the control plan and station instructions. lead-daily-routine is available; solve-8d is coming soon; the other skills are planned.</desc>
